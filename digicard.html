<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Informações e detalhes dos Digimons.">
    <title>Digimon | Digi Analyzer</title>
    <link rel="stylesheet" href="./digi_analyzer/css/style.css">
    <link rel="stylesheet" href="./digi_analyzer/css/digimon-detalhe.css">
</head>

<body class="pagina-detalhe">
    <header>
        <h1>Digi Analyzer</h1>
        <div class="logo">
            <img src="./digi_analyzer/assets/images/logo digimon.png" alt="Logo Digimon">
        </div>
    </header>

    <main class="detalhe">
        <a class="voltar" href="./index.html">&larr; Voltar para os Digimons</a>

        <nav class="navegacao-digimon" aria-label="Navegação entre Digimons">
            <button id="digimon-anterior" type="button">&larr; Anterior</button>
            <button id="digimon-proximo" type="button">Próximo &rarr;</button>
        </nav>

        <article class="perfil-digimon" aria-live="polite">
            <div class="perfil-imagem">
                <img id="imagem-digimon" src="./digi_analyzer/assets/images/bebes digimon/Botamon_b.webp" alt="Botamon, ID 001">
            </div>

            <div class="perfil-conteudo">
                <p class="identificador" id="identificador-digimon">DIGIMON · ID 001</p>
                <h2 id="nome-digimon">Botamon</h2>
                <p class="resumo" id="resumo-digimon"></p>

                <section class="informacoes" aria-labelledby="titulo-informacoes">
                    <h3 id="titulo-informacoes">Informações básicas</h3>
                    <dl>
                        <div>
                            <dt>Estágio</dt>
                            <dd id="nivel-digimon">Baby I</dd>
                        </div>
                        <div>
                            <dt>Tipo</dt>
                            <dd id="tipo-digimon">Slime</dd>
                        </div>
                        <div>
                            <dt>Field</dt>
                            <dd id="field-digimon"></dd>
                        </div>
                    </dl>
                    <h3 class="titulo-habilidades">Habilidades</h3>
                    <dl id="habilidades-digimon"></dl>
                </section>
            </div>
        </article>

        <section class="descricao" aria-labelledby="titulo-descricao">
            <h2 id="titulo-descricao">Descrição</h2>
            <p id="descricao-digimon"></p>
        </section>
    </main>
    <script src="./digi_analyzer/js/script.js"></script>
</body>

</html>
